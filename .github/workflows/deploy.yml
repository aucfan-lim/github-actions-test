name: github-actions-test

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on:
      ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Set JDK21
        uses: actions/setup-java@v5.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Grant permission
        run: chmod +x ./gradlew
        shell: bash

      - name: Build
        run: ./gradlew clean build
        shell: bash
