name: github-actions-test

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on:
      ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout

      - name: Set JDK21
        uses: actions/setup-java
        with:
          java-version: 21.0.2

      - name: Grant permission
        run: chmod +x ./gradlew
        shell: bash

      - name: Build
        run: ./gradlew clean build
        shell: bash
